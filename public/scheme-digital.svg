  <text x="16" y="22" font-family="'Noto Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">DIGITAL</text>
  <text x="16" y="38" font-family="'Noto Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#ff9933" letter-spacing="0.5">NAGARPRATIN IDHI</text>
